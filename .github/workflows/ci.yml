name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shells for hook tests
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Byte-compile
        run: python -m compileall -q . && python -m py_compile island
      - name: Lint
        run: pip install ruff && ruff check --select E9,F63,F7,F82,F401,F841 .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 tools
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: QML syntax
        # Kirigami / layer-shell CI'da yok: yalnızca sözdizimi ve JS hataları denetlenir
        run: |
          QMLLINT=$(ls /usr/lib/qt6/bin/qmllint /usr/lib/*/qt6/bin/qmllint 2>/dev/null | head -1)
          fail=0
          for f in contents/ui/*.qml; do
            out=$("$QMLLINT" --unqualified disable --import disable --unresolved-type disable \
                  --missing-property disable --type disable "$f" 2>&1) || true
            if echo "$out" | grep -q "^Error"; then echo "$out"; fail=1; fi
          done
          exit $fail
